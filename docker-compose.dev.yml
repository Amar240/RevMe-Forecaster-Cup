services:
  db:
    image: postgres:16
    container_name: revme-postgres-dev
    restart: unless-stopped
    ports:
      - "15432:5432"
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-revme}
      POSTGRES_USER: ${POSTGRES_USER:-revme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Goud@123}
    volumes:
      - revme_pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revme} -d ${POSTGRES_DB:-revme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: revme-app-dev
    depends_on:
      - db
    ports:
      - "5000:5000"
      - "15555:5555"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npx prisma generate && npm run dev"]
    restart: unless-stopped

  studio:
    image: node:20-alpine
    container_name: revme-prisma-studio
    working_dir: /app
    depends_on:
      - db
    ports:
      - "15556:5555"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npm ci && npx prisma studio --hostname 0.0.0.0 --port 5555"]
    restart: unless-stopped

volumes:
  revme_pg_data_dev:
