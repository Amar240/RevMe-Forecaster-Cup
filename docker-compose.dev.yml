services:
  db:
    image: postgres:16
    container_name: revme-postgres-dev
    restart: unless-stopped
    ports:
      - "15432:5432"
    env_file:
      - .env.docker
    volumes:
      - revme_pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revme} -d ${POSTGRES_DB:-revme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: revme-app-dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:5000"
      - "15555:5555"
    env_file:
      - .env.docker
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - /app/node_modules
      - revme_next_dev:/app/.next
    command: ["sh", "-c", "npx prisma generate && npx prisma migrate deploy && NODE_ENV=development npm run dev"]
    restart: unless-stopped

  studio:
    image: node:20-alpine
    container_name: revme-prisma-studio
    working_dir: /app
    depends_on:
      - db
    ports:
      - "15556:5555"
    env_file:
      - .env.docker
    volumes:
      - .:/app
      - /app/node_modules
    command: ["sh", "-c", "npm ci && npx prisma studio --hostname 0.0.0.0 --port 5555"]
    restart: unless-stopped

volumes:
  revme_pg_data_dev:
  revme_next_dev:
